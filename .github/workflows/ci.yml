name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gate:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SELLER_PHONE: "+21600000000"
          NEXT_PUBLIC_WHATSAPP_NUMBER: "21600000000"
          ADMIN_JWT_SECRET: "ci-placeholder-secret-not-a-real-credential-123456"

  deploy:
    name: Deploy to Cloudflare (prod)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudflare-deploy-prod
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check deploy credentials
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit). Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build OpenNext worker
        run: npm run cf:build
        env:
          # NEXT_PUBLIC_* values are inlined at build time.
          NEXT_PUBLIC_SELLER_PHONE: ${{ vars.NEXT_PUBLIC_SELLER_PHONE }}
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute gamestore_db --remote --yes --file=./schema.sql

      - name: Set worker secret ADMIN_JWT_SECRET
        if: ${{ env.ADMIN_JWT_SECRET != '' }}
        run: printf '%s' "$ADMIN_JWT_SECRET" | npx wrangler secret put ADMIN_JWT_SECRET

      - name: Deploy worker
        run: npx opennextjs-cloudflare deploy --skipBuild
