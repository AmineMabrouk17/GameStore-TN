name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gate:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SELLER_PHONE: "+21600000000"
          NEXT_PUBLIC_WHATSAPP_NUMBER: "21600000000"
          ADMIN_JWT_SECRET: "ci-placeholder-secret-not-a-real-credential-123456"
