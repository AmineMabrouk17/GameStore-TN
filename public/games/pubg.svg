<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="PUBG Mobile">
  <defs>
    <linearGradient id="pubg-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#a16207"/>
      <stop offset="1" stop-color="#271605"/>
    </linearGradient>
    <radialGradient id="pubg-glow" cx="50%" cy="34%" r="60%">
      <stop stop-color="#fef08a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pubg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    </pattern>
    <filter id="pubg-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#pubg-bg)"/>
  <rect width="800" height="600" fill="url(#pubg-grid)"/>
  <circle cx="400" cy="225" r="225" fill="url(#pubg-glow)"/>
  <path d="M0 470 L800 380 L800 420 L0 510 Z" fill="#000000" fill-opacity="0.18"/>
  <path d="M330 96 L360 60 L376 96 Z" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M430 84 L458 52 L472 84 Z" fill="#ffffff" fill-opacity="0.28"/>
  <path d="M382 110 L398 88 L412 110 Z" fill="#ffffff" fill-opacity="0.4"/>
  <ellipse cx="400" cy="520" rx="270" ry="72" fill="#000000" fill-opacity="0.3"/>
  <text x="400" y="330" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="160" font-weight="900" font-style="italic" letter-spacing="6" fill="#fffbeb">PUBG</text>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="14" fill="#fef3c7" fill-opacity="0.92">BATTLEGROUNDS</text>
  <rect x="300" y="462" width="200" height="6" rx="3" fill="#22d3ee"/>
  <rect x="338" y="478" width="124" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#pubg-noise)"/>
</svg>
