<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Free Fire alt cover">
  <defs>
    <linearGradient id="ff2-bg" x1="0" y1="600" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#be123c"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="ff2-glow" cx="52%" cy="36%" r="60%">
      <stop stop-color="#fecdd3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ff2-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="ff2-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#ff2-bg)"/>
  <rect width="800" height="600" fill="url(#ff2-grid)"/>
  <circle cx="395" cy="225" r="220" fill="url(#ff2-glow)"/>
  <circle cx="640" cy="140" r="26" fill="#fde047" fill-opacity="0.5"/>
  <circle cx="170" cy="430" r="18" fill="#22d3ee" fill-opacity="0.45"/>
  <ellipse cx="400" cy="532" rx="255" ry="68" fill="#000000" fill-opacity="0.28"/>
  <text x="400" y="330" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="190" font-weight="900" font-style="italic" letter-spacing="8" fill="#ffffff">FF</text>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="16" fill="#ffe4e6">FREE FIRE</text>
  <rect x="310" y="460" width="180" height="6" rx="3" fill="#22d3ee"/>
  <rect x="345" y="476" width="110" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#ff2-noise)"/>
</svg>
