<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="eFootball PES">
  <defs>
    <linearGradient id="pes-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="pes-glow" cx="52%" cy="36%" r="62%">
      <stop stop-color="#a7f3d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pes-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="pes-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <linearGradient id="pes-text" x1="250" y1="170" x2="550" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pes-bg)"/>
  <rect width="800" height="600" fill="url(#pes-grid)"/>
  <circle cx="410" cy="225" r="225" fill="url(#pes-glow)"/>
  <ellipse cx="400" cy="530" rx="260" ry="70" fill="#000000" fill-opacity="0.25"/>
  <path d="M400 470 L470 500 L400 530 L330 500 Z" fill="#ffffff" fill-opacity="0.15"/>
  <text x="400" y="320" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="190" font-weight="900" font-style="italic" letter-spacing="6" fill="url(#pes-text)">PES</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="16" fill="#ffffff" fill-opacity="0.85">EFOOTBALL</text>
  <rect x="290" y="460" width="220" height="6" rx="3" fill="#22d3ee"/>
  <rect x="330" y="476" width="140" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#pes-noise)"/>
</svg>
