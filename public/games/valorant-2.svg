<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Valorant alt cover">
  <defs>
    <linearGradient id="val2-bg" x1="800" y1="0" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8fa3"/>
      <stop offset="0.5" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="val2-glow" cx="48%" cy="34%" r="62%">
      <stop stop-color="#ffe4e6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe4e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="val2-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="val2-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#val2-bg)"/>
  <rect width="800" height="600" fill="url(#val2-grid)"/>
  <circle cx="410" cy="220" r="220" fill="url(#val2-glow)"/>
  <path d="M60 -30 L200 -30 L-40 330 L-180 330 Z" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M840 300 L980 300 L740 660 L600 660 Z" fill="#ffffff" fill-opacity="0.05"/>
  <ellipse cx="400" cy="530" rx="255" ry="70" fill="#000000" fill-opacity="0.3"/>
  <text x="400" y="330" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="190" font-weight="900" font-style="italic" letter-spacing="8" fill="#ffffff">VL</text>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="18" fill="#fecdd3">RADIANT</text>
  <rect x="305" y="460" width="190" height="6" rx="3" fill="#22d3ee"/>
  <rect x="340" y="476" width="120" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#val2-noise)"/>
</svg>
