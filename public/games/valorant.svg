<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Valorant">
  <defs>
    <linearGradient id="val-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4655"/>
      <stop offset="0.55" stop-color="#8f2d3a"/>
      <stop offset="1" stop-color="#1f0b10"/>
    </linearGradient>
    <radialGradient id="val-glow" cx="50%" cy="36%" r="60%">
      <stop stop-color="#ffd7dc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd7dc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="val-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="val-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#val-bg)"/>
  <rect width="800" height="600" fill="url(#val-grid)"/>
  <circle cx="400" cy="230" r="225" fill="url(#val-glow)"/>
  <path d="M400 120 L470 250 L330 250 Z" fill="#ffffff" fill-opacity="0.12"/>
  <path d="M400 160 L444 240 L356 240 Z" fill="#ffffff" fill-opacity="0.14"/>
  <ellipse cx="400" cy="528" rx="260" ry="70" fill="#000000" fill-opacity="0.3"/>
  <text x="400" y="325" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="185" font-weight="900" font-style="italic" letter-spacing="10" fill="#ffffff">VAL</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="20" fill="#ffe4e6">VALORANT</text>
  <rect x="295" y="456" width="210" height="6" rx="3" fill="#22d3ee"/>
  <rect x="333" y="472" width="134" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#val-noise)"/>
</svg>
