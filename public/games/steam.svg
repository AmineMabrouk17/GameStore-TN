<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Steam PC games">
  <defs>
    <linearGradient id="stm-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <radialGradient id="stm-glow" cx="50%" cy="34%" r="62%">
      <stop stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="stm-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#stm-bg)"/>
  <rect width="800" height="600" fill="url(#stm-grid)"/>
  <circle cx="400" cy="225" r="228" fill="url(#stm-glow)"/>
  <circle cx="400" cy="235" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="400" cy="235" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <ellipse cx="400" cy="528" rx="260" ry="70" fill="#000000" fill-opacity="0.28"/>
  <text x="400" y="300" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="175" font-weight="900" font-style="italic" letter-spacing="8" fill="#f0f9ff">ST</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="14" fill="#e0f2fe">STEAM / PC GAMES</text>
  <rect x="295" y="450" width="210" height="6" rx="3" fill="#22d3ee"/>
  <rect x="333" y="466" width="134" height="4" rx="2" fill="#ff2ee6"/>
  <rect width="800" height="600" filter="url(#stm-noise)"/>
</svg>
